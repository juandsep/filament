version: 2
updates:
  # GitHub Actions used by the workflows: a pull request for every new version.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    labels:
      - dependencies

  # Composer: security updates only. The application that installs the plugin
  # picks the exact versions, so routine bumps here would only be noise.
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    cooldown:
      default-days: 7
    labels:
      - dependencies
