name: Bug report
description: Something doesn't work as it should
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Please don't paste API keys or real customer data; a made-up example row is enough.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: how-to-reproduce
    attributes:
      label: How to reproduce it
      description: The filter setup (text columns, threshold, limit), the statement you typed, and the steps.
      render: php
    validations:
      required: true
  - type: input
    id: package-version
    attributes:
      label: Vibefilter version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: filament-version
    attributes:
      label: Filament version
      placeholder: 5.9.0
    validations:
      required: true
  - type: input
    id: laravel-version
    attributes:
      label: Laravel version
      placeholder: 13.0.0
    validations:
      required: true
  - type: input
    id: php-version
    attributes:
      label: PHP version
      placeholder: 8.4.0
    validations:
      required: true
  - type: dropdown
    id: driver
    attributes:
      label: Driver
      options:
        - typesafe
        - fake
        - other
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else?
      description: Error messages, logs (without keys), screenshots.
